# LAB ONLY: small single-node workloads, ephemeral storage, no HA.
# Pin dependency versions in Chart.lock after helm dependency update.
prometheus:
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  server:
    persistentVolume:
      enabled: false
    retention: 2d
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 768Mi}
  kube-state-metrics:
    enabled: true
  prometheus-node-exporter:
    enabled: true

grafana:
  adminUser: admin
  # Set password using a Kubernetes Secret, never commit it to Git.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  service:
    type: ClusterIP
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://observability-prometheus-server
          isDefault: true
        - name: Loki
          type: loki
          access: proxy
          url: http://observability-loki:3100

loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: filesystem
    limits_config:
      retention_period: 48h
      allow_structured_metadata: true
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
  singleBinary:
    replicas: 1
    persistence:
      enabled: false
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  gateway:
    enabled: false
  minio:
    enabled: false
  monitoring:
    selfMonitoring:
      enabled: false
    lokiCanary:
      enabled: false

# Promtail is a legacy log collector. For production, migrate to Grafana Alloy.
promtail:
  config:
    clients:
      - url: http://observability-loki:3100/loki/api/v1/push
